name: Profile renderer

on:
  push:
    paths:
      - profile-surface.json
      - scripts/render-profile.mjs
      - assets/system-surface-*.svg
      - .github/workflows/render-profile.yml
  pull_request:
    paths:
      - profile-surface.json
      - scripts/render-profile.mjs
      - assets/system-surface-*.svg
      - .github/workflows/render-profile.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Render profile surface
        run: node scripts/render-profile.mjs
      - name: Verify committed assets
        run: git diff --exit-code -- assets/system-surface-light.svg assets/system-surface-dark.svg
