<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title description">
  <title id="title">Angus Uelsmann public system surface</title>
  <desc id="description">Current public work, products and writing by Angus Uelsmann.</desc>
  <defs>
    <radialGradient id="glow" cx="88%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ddd5ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#f5f3ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .eyebrow, .label, .footer { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .eyebrow { fill: #7257e8; font-size: 14px; font-weight: 700; letter-spacing: 2.2px; }
      .headline { fill: #17152b; font-size: 29px; font-weight: 700; }
      .label { fill: #7257e8; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
      .value { fill: #17152b; font-size: 18px; font-weight: 700; }
      .detail { fill: #6d6887; font-size: 14px; }
      .footer { fill: #6d6887; font-size: 11px; letter-spacing: .65px; }
    </style>
  </defs>
  <rect width="1120" height="390" rx="26" fill="#f5f3ff"/>
  <rect width="1120" height="390" rx="26" fill="url(#glow)"/>
  <rect x="1" y="1" width="1118" height="388" rx="25" fill="none" stroke="#ded8f6"/>
  <circle cx="56" cy="56" r="7" fill="#7257e8"/>
  <text x="78" y="61" class="eyebrow">UNDERNEATH / PUBLIC SYSTEM SURFACE</text>
  <text x="48" y="126" class="headline">Calm on top. Working systems underneath.</text>
  <g transform="translate(48 174)">
    <rect width="330" height="132" rx="18" fill="#ffffff" stroke="#ded8f6"/>
    <text x="24" y="33" class="label">PUBLIC SURFACE</text>
    <text x="24" y="70" class="value">angusu.de</text>
    <text x="24" y="101" class="detail">products, docs &amp; insights</text>
  </g>
  <g transform="translate(395 174)">
    <rect width="330" height="132" rx="18" fill="#ffffff" stroke="#ded8f6"/>
    <text x="24" y="33" class="label">CURRENT BUILD</text>
    <text x="24" y="70" class="value">Nightwave · ImageFlow</text>
    <text x="24" y="101" class="detail">visionSort · local-first</text>
  </g>
  <g transform="translate(742 174)">
    <rect width="330" height="132" rx="18" fill="#ffffff" stroke="#ded8f6"/>
    <text x="24" y="33" class="label">LATEST THOUGHT</text>
    <text x="24" y="70" class="value">Good systems remove decisions</text>
    <text x="24" y="101" class="detail">engineering · product · design</text>
  </g>
  <line x1="48" y1="340" x2="1072" y2="340" stroke="#ded8f6"/>
  <text x="48" y="369" class="footer">PHP  /  C#  /  JAVASCRIPT  /  MARIADB     ·     PRIVACY-AWARE  /  LOCAL-FIRST</text>
</svg>
